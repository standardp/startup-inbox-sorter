<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Startup Inbox</title>
<script src="./chart.umd.js"></script>
<style>
  :root {
    --bg: #f6f7fb; --panel: #fff; --ink: #1d2433; --muted: #6b7385; --line: #e5e8f0;
    --accent: #4f46e5; --accent-soft: #eef0ff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Inter, system-ui, -apple-system, Segoe UI, sans-serif; background: var(--bg); color: var(--ink); }
  header { display: flex; align-items: center; gap: 16px; padding: 16px 28px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 18px; margin: 0; }
  .badge { font-size: 12px; padding: 3px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
  .badge.warn { background: #fff4e5; color: #b45309; }
  .spacer { flex: 1; }
  button { font: inherit; border: 1px solid var(--line); background: var(--panel); padding: 8px 14px; border-radius: 8px; cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button:disabled { opacity: .6; cursor: progress; }
  main { display: grid; grid-template-columns: 300px 1fr; gap: 20px; padding: 20px 28px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px; }
  .stat b { display: block; font-size: 24px; }
  .stat span { color: var(--muted); font-size: 13px; }
  .industries { list-style: none; padding: 0; margin: 12px 0 0; }
  .industries li { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 14px; }
  .industries li:hover { background: var(--bg); }
  .industries li.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .count { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
  .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; }
  .toolbar input[type=search] { flex: 1; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; font: inherit; }
  .toolbar label { font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
  .groups { display: flex; flex-direction: column; gap: 18px; }
  .group h2 { font-size: 15px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--c); border-radius: 10px; padding: 12px 14px; cursor: pointer; }
  .card:hover { box-shadow: 0 2px 10px rgba(20,30,60,.07); }
  .card .company { font-weight: 600; }
  .card .subject { font-size: 14px; margin: 4px 0; }
  .card .summary { font-size: 13px; color: var(--muted); }
  .card .meta { font-size: 12px; color: var(--muted); margin-top: 8px; display: flex; justify-content: space-between; }
  .empty { color: var(--muted); text-align: center; padding: 40px; }
  dialog { border: none; border-radius: 14px; max-width: 680px; width: 90%; padding: 24px; }
  dialog::backdrop { background: rgba(15,20,35,.4); }
  dialog .body { white-space: pre-wrap; font-size: 14px; line-height: 1.5; max-height: 45vh; overflow: auto; background: var(--bg); padding: 12px; border-radius: 8px; }
  dialog select { font: inherit; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--line); }
  a.btn { font-size: 14px; color: var(--ink); text-decoration: none; border: 1px solid var(--line); padding: 8px 14px; border-radius: 8px; }
  #unlock { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 10; }
  #unlock form { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 28px; width: 340px; display: flex; flex-direction: column; gap: 12px; }
  #unlock input[type=password] { font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; }
  #unlock .err { color: #dc2626; font-size: 13px; min-height: 16px; }
  #toast { position: fixed; bottom: 20px; right: 20px; background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 14px; display: none; }
</style>
</head>
<body>
<header>
  <h1>Startup Inbox</h1>
  <span id="sourceBadge" class="badge"></span>
  <span id="classifierBadge" class="badge"></span>
  <span id="syncInfo" style="font-size:12px;color:var(--muted)"></span>
  <div class="spacer"></div>
  <a id="sortNow" class="btn" target="_blank" rel="noopener" style="display:none">Sort now ↗</a>
  <button id="lockBtn">Lock</button>
</header>
<main>
  <aside>
    <div class="panel">
      <div class="stats">
        <div class="stat"><b id="statTotal">0</b><span>Startups</span></div>
        <div class="stat"><b id="statIndustries">0</b><span>Industries</span></div>
        <div class="stat"><b id="statWeek">0</b><span>Last 7 days</span></div>
      </div>
      <canvas id="chart" height="220"></canvas>
      <ul class="industries" id="industryList"></ul>
    </div>
  </aside>
  <section>
    <div class="toolbar">
      <input type="search" id="search" placeholder="Search company, sender, subject…" />
      <label><input type="checkbox" id="showNonStartup" /> Show non-startup emails</label>
    </div>
    <div class="groups" id="groups"></div>
  </section>
</main>

<dialog id="detail">
  <h3 id="dCompany" style="margin:0 0 4px"></h3>
  <div id="dFrom" style="color:var(--muted);font-size:13px"></div>
  <p id="dSubject" style="font-weight:600"></p>
  <p id="dSummary" style="color:var(--muted)"></p>
  <div class="body" id="dBody"></div>
  <div style="display:flex;gap:10px;align-items:center;margin-top:16px">
    <span style="font-size:13px">Industry:</span>
    <select id="dIndustry"></select>
    <div class="spacer"></div>
    <button onclick="detail.close()">Close</button>
  </div>
</dialog>
<div id="toast"></div>
<div id="unlock">
  <form id="unlockForm">
    <h2 style="margin:0">Startup Inbox</h2>
    <span style="color:var(--muted);font-size:14px">Enter your passphrase to decrypt the dashboard.</span>
    <input type="password" id="pass" placeholder="Passphrase" autocomplete="current-password" autofocus />
    <label style="font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center"><input type="checkbox" id="remember" /> Remember on this device</label>
    <button class="primary" type="submit">Unlock</button>
    <div class="err" id="unlockErr"></div>
  </form>
</div>

<script>
const PALETTE = ["#4f46e5","#0ea5e9","#10b981","#22c55e","#f59e0b","#ef4444","#ec4899","#8b5cf6","#14b8a6","#f97316","#64748b","#a855f7","#06b6d4","#eab308","#84cc16","#d946ef","#0284c7","#dc2626","#9ca3af"];
let state = { emails: [], industries: [], selected: null, chart: null };
const $ = (id) => document.getElementById(id);
const color = (ind) => PALETTE[state.industries.indexOf(ind) % PALETTE.length];
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function toast(msg) { const t = $("toast"); t.textContent = msg; t.style.display = "block"; setTimeout(() => t.style.display = "none", 3500); }

const OVERRIDES_KEY = "startup-inbox-overrides";
const PASS_KEY = "startup-inbox-pass";
const overrides = () => JSON.parse(localStorage.getItem(OVERRIDES_KEY) || "{}");
const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

async function decrypt(blob, passphrase) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(passphrase), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", hash: "SHA-256", salt: b64(blob.salt), iterations: blob.iterations },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(blob.iv) }, key, b64(blob.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}

async function load(passphrase) {
  const res = await fetch(`data.json?t=${Date.now()}`, { cache: "no-store" });
  if (res.status === 404) throw new Error("No data yet. The first daily run hasn't happened.");
  const data = await decrypt(await res.json(), passphrase);
  const ov = overrides();
  state.industries = data.industries;
  state.emails = data.emails.map((e) => ov[e.id] ? { ...e, industry: ov[e.id], classifier: "manual" } : e);
  $("sourceBadge").textContent = data.source === "gmail" ? "Gmail" : "Sample data";
  $("sourceBadge").className = "badge" + (data.source === "gmail" ? "" : " warn");
  $("classifierBadge").textContent = data.classifier === "keywords" ? "Keyword classification" : `AI: ${data.classifier}`;
  $("syncInfo").textContent = `Emails since ${data.start_date} · sorted daily at 7:00 AM` +
    (data.last_sync ? ` · last run ${new Date(data.last_sync).toLocaleString()}` : "");
  if (data.repo) { $("sortNow").href = `https://github.com/${data.repo}/actions/workflows/sync.yml`; $("sortNow").style.display = ""; }
  render();
}

function visible() {
  const q = $("search").value.toLowerCase();
  const showAll = $("showNonStartup").checked;
  return state.emails.filter((e) =>
    (showAll || e.is_startup) &&
    (!q || [e.company, e.sender_name, e.sender_email, e.subject, e.summary].join(" ").toLowerCase().includes(q))
  );
}

function render() {
  const emails = visible();
  const counts = {};
  emails.forEach((e) => counts[e.industry] = (counts[e.industry] || 0) + 1);
  const ordered = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  const weekAgo = Date.now() - 7 * 864e5;

  $("statTotal").textContent = emails.length;
  $("statIndustries").textContent = ordered.length;
  $("statWeek").textContent = emails.filter((e) => new Date(e.received_at) > weekAgo).length;

  $("industryList").innerHTML =
    `<li class="${state.selected ? "" : "active"}" data-ind=""><span class="dot" style="background:#1d2433"></span>All industries<span class="count">${emails.length}</span></li>` +
    ordered.map(([ind, n]) => `<li class="${state.selected === ind ? "active" : ""}" data-ind="${esc(ind)}"><span class="dot" style="background:${color(ind)}"></span>${esc(ind)}<span class="count">${n}</span></li>`).join("");
  document.querySelectorAll("#industryList li").forEach((li) => li.onclick = () => { state.selected = li.dataset.ind || null; render(); });

  const data = { labels: ordered.map((o) => o[0]), datasets: [{ data: ordered.map((o) => o[1]), backgroundColor: ordered.map((o) => color(o[0])), borderWidth: 0 }] };
  if (state.chart) { state.chart.data = data; state.chart.update(); }
  else state.chart = new Chart($("chart"), { type: "doughnut", data, options: { cutout: "65%", plugins: { legend: { display: false } },
    onClick: (_, els) => { if (els.length) { state.selected = data.labels[els[0].index]; render(); } } } });

  const groups = ordered.filter(([ind]) => !state.selected || ind === state.selected);
  $("groups").innerHTML = groups.length ? groups.map(([ind]) => `
    <div class="group">
      <h2><span class="dot" style="background:${color(ind)}"></span>${esc(ind)} <span class="count">${counts[ind]}</span></h2>
      <div class="cards">${emails.filter((e) => e.industry === ind).map(card).join("")}</div>
    </div>`).join("") : `<div class="empty">${state.emails.length ? "No emails match." : "No startup emails yet. New ones will show up here automatically."}</div>`;
  document.querySelectorAll(".card").forEach((c) => c.onclick = () => openDetail(c.dataset.id));
}

function card(e) {
  const date = e.received_at ? new Date(e.received_at).toLocaleDateString() : "";
  return `<div class="card" style="--c:${color(e.industry)}" data-id="${esc(e.id)}">
    <div class="company">${esc(e.company || e.sender_name)}</div>
    <div class="subject">${esc(e.subject)}</div>
    <div class="summary">${esc(e.summary)}</div>
    <div class="meta"><span>${esc(e.sender_name)}</span><span>${date}</span></div>
  </div>`;
}

function openDetail(id) {
  const e = state.emails.find((x) => x.id === id);
  $("dCompany").textContent = e.company || e.sender_name;
  $("dFrom").textContent = `${e.sender_name} <${e.sender_email}> · ${e.received_at ? new Date(e.received_at).toLocaleString() : ""}`;
  $("dSubject").textContent = e.subject;
  $("dSummary").textContent = e.summary;
  $("dBody").textContent = e.body;
  $("dIndustry").innerHTML = state.industries.map((i) => `<option ${i === e.industry ? "selected" : ""}>${esc(i)}</option>`).join("");
  $("dIndustry").onchange = (ev) => {
    localStorage.setItem(OVERRIDES_KEY, JSON.stringify({ ...overrides(), [id]: ev.target.value }));
    e.industry = ev.target.value; e.classifier = "manual"; render(); toast("Industry updated on this device");
  };
  $("detail").showModal();
}

async function unlock(passphrase, remember) {
  $("unlockErr").textContent = "";
  try {
    await load(passphrase);
    sessionStorage.setItem(PASS_KEY, passphrase);
    if (remember) localStorage.setItem(PASS_KEY, passphrase);
    $("unlock").style.display = "none";
  } catch (err) {
    $("unlockErr").textContent = err instanceof DOMException || err.name === "OperationError" ? "Wrong passphrase." : err.message;
    localStorage.removeItem(PASS_KEY); sessionStorage.removeItem(PASS_KEY);
  }
}

$("unlockForm").onsubmit = (ev) => { ev.preventDefault(); unlock($("pass").value, $("remember").checked); };
$("lockBtn").onclick = () => { localStorage.removeItem(PASS_KEY); sessionStorage.removeItem(PASS_KEY); location.reload(); };
$("search").oninput = render;
$("showNonStartup").onchange = render;
const saved = sessionStorage.getItem(PASS_KEY) || localStorage.getItem(PASS_KEY);
if (saved) unlock(saved, false);
</script>
</body>
</html>
