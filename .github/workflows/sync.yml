name: Sort emails and publish dashboard

on:
  schedule:
    - cron: "0 12 * * *" # 07:00 America/Bogota (UTC-5)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: America/Bogota
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Fetch and classify new emails
        if: github.event_name != 'push'
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          LYBER_API_KEY: ${{ secrets.LYBER_API_KEY }}
          DASHBOARD_PASSPHRASE: ${{ secrets.DASHBOARD_PASSPHRASE }}
          GMAIL_START_DATE: ${{ vars.GMAIL_START_DATE || '2026-11-17' }}
          GMAIL_QUERY: ${{ vars.GMAIL_QUERY || '-from:me -filename:ics -category:promotions -category:social' }}
          GMAIL_MAX_EMAILS: ${{ vars.GMAIL_MAX_EMAILS || '300' }}
        run: python sync.py

      - name: Commit encrypted data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet || git commit -m "Update dashboard data" && git push

  deploy:
    needs: sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
